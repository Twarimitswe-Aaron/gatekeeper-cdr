[package]
name = "gatekeeper-python"
version = "0.4.4"
edition = "2024"
publish = false

[lib]
name = "gatekeeper_cdr"
crate-type = ["cdylib"]

[dependencies]
gatekeeper = { path = "../../core" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "macros"] }
# Bridges Rust tokio futures into native Python asyncio coroutines
pyo3-async-runtimes = { version = "0.22", features = ["tokio-runtime"] }


