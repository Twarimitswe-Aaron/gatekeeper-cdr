name: Node.js Bindings CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build Node.js Bindings (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}


      - name: Install Node Dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Install NAPI CLI Globally
        run: npm install -g @napi-rs/cli@2.18.3

      - name: Build Native Module
        working-directory: bindings/node
        run: napi build --platform --release --target ${{ matrix.target }}

      - name: Test Native Module
        working-directory: bindings/node
        continue-on-error: true # Prevents CI from failing if testing an ARM binary on an Intel runner
        run: node -e "const { disarm } = require('.'); console.log('disarm loaded:', typeof disarm)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-node-${{ matrix.target }}
          path: bindings/node/*.node

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/node
          pattern: gatekeeper-node-*
          merge-multiple: true
          
      - name: Publish Package
        working-directory: bindings/node
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
